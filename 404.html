<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Андрей Мейстер</title>
  <meta name="description" content="Такой страницы нет на сайте meysternlp.ru. Вернитесь на главную или загляните в блог.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0C0C0C;
      color: #F0F0F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 720px; text-align: center; }
    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 200;
      color: #3A86FF;
      letter-spacing: 0.1em;
      line-height: 1;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 25px;
      color: #FFFFFF;
    }
    p {
      color: #CCCCCC;
      font-size: clamp(1rem, 3vw, 1.1rem);
      font-weight: 300;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .links a {
      display: inline-block;
      padding: 13px 28px;
      border: 1px solid #3A86FF;
      color: #FFFFFF;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.85rem;
      font-weight: 400;
      transition: all 0.25s ease;
      min-width: 160px;
    }
    .links a:hover {
      background: #3A86FF;
      color: #0C0C0C;
      box-shadow: 0 0 20px #3A86FF;
    }
    .quote {
      margin-top: 50px;
      color: #666;
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
<style>/* Длинные слова — «высокочувствительный», «стрессоустойчивость» — не
   переносились и распирали заголовок шире экрана телефона, утаскивая
   за собой всю страницу. Перенос включается только там, где слово
   иначе не помещается. */
body{overflow-wrap:break-word}</style>
</head>
<body>
  <main class="container">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Видимо, этой страницы тут никогда не было — или она переехала. Загляните в другие разделы.</p>
    <nav class="links">
      <a href="/">Главная</a>
      <a href="/blog/">Блог</a>
      <a href="/knigi/">Книги</a>
      <a href="/fredi/">Фреди</a>
      <a href="/obo-mne/">Обо мне</a>
    </nav>
    <div class="quote">«Нарратив определяет, куда вы идёте дальше»</div>
  </main>
</body>
</html>
