  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0C0C0C;
      color: #F0F0F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 720px; text-align: center; }
    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 200;
      color: #3A86FF;
      letter-spacing: 0.1em;
      line-height: 1;
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 25px;
      color: #FFFFFF;
    }
    p {
      color: #CCCCCC;
      font-size: clamp(1rem, 3vw, 1.1rem);
      font-weight: 300;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .links a {
      display: inline-block;
      padding: 13px 28px;
      border: 1px solid #3A86FF;
      color: #FFFFFF;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.85rem;
      font-weight: 400;
      transition: all 0.25s ease;
      min-width: 160px;
    }
    .links a:hover {
      background: #3A86FF;
      color: #0C0C0C;
      box-shadow: 0 0 20px #3A86FF;
    }
    .quote {
      margin-top: 50px;
      color: #666;
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
<style>/* Длинные слова — «высокочувствительный», «стрессоустойчивость» — не
   переносились и распирали заголовок шире экрана телефона, утаскивая
   за собой всю страницу. Перенос включается только там, где слово
   иначе не помещается. */
body{overflow-wrap:break-word}</style>
</head>
