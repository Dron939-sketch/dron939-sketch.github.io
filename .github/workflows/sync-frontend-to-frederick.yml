name: Sync fredi/ → Frederick/frontend/

# КАНОНИЧНЫЙ источник фронта — этот репозиторий, папка fredi/.
# Каждый push в main (если затронут fredi/**) автоматически
# зеркалит содержимое fredi/ в Dron939-sketch/Frederick:frontend/.
# Это предотвращает дрейф между фронтом на meysternlp.ru/fredi/
# и фронтом, который Render-static тянет из Frederick/frontend/.
#
# Требуется secret SYNC_PAT — Personal Access Token с правом
# `contents: write` на репо Dron939-sketch/Frederick.
# Создать: GitHub → Settings → Developer settings → Personal access
#  tokens → Fine-grained → Repository access: Dron939-sketch/Frederick
#  → Permissions: Contents=Read & Write. Положить в Secrets этого
#  репозитория (Settings → Secrets → Actions → New) как SYNC_PAT.

on:
  push:
    branches: [main]
    paths:
      - 'fredi/**'
      - '.github/workflows/sync-frontend-to-frederick.yml'
  workflow_dispatch:

concurrency:
  group: sync-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout site (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SYNC_PAT is configured
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          if [ -z "$SYNC_PAT" ]; then
            echo "::error::SYNC_PAT secret is not set. See workflow header for setup instructions."
            exit 1
          fi

      - name: Checkout Frederick (frontend/ only, sparse)
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${SYNC_PAT}@github.com/Dron939-sketch/Frederick.git" \
            frederick-clone
          cd frederick-clone
          git sparse-checkout set frontend

      - name: Sync fredi/ → Frederick/frontend/
        run: |
          set -euo pipefail
          # Один-в-один: новые файлы добавляются, удалённые в fredi/ —
          # удаляются и во Frederick/frontend/. .git/ исключаем явно
          # на всякий случай.
          mkdir -p frederick-clone/frontend
          rsync -a --delete \
            --exclude '.git' \
            fredi/ frederick-clone/frontend/

      - name: Commit & push if changed
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd frederick-clone
          git config user.name  "frontend-sync-bot"
          git config user.email "frontend-sync-bot@users.noreply.github.com"
          git add -A frontend/
          if git diff --cached --quiet; then
            echo "No frontend changes to mirror — Frederick already in sync."
            exit 0
          fi
          SHORT_SHA="${SOURCE_SHA:0:7}"
          # Многострочный commit message через файл — иначе YAML literal block
          # прерывается на пустых строках внутри -m "...".
          {
            echo "chore(sync): mirror fredi/ from site@${SHORT_SHA}"
            echo ""
            echo "Auto-generated by sync-frontend-to-frederick workflow."
            echo "Source: https://github.com/Dron939-sketch/dron939-sketch.github.io/commit/${SOURCE_SHA}"
            echo ""
            echo "The canonical source for the Fredi frontend is the site repo's"
            echo "fredi/ directory. Edits to Frederick/frontend/ will be overwritten"
            echo "by the next sync — make changes in the site repo instead."
          } > /tmp/sync_commit_msg.txt
          git commit -F /tmp/sync_commit_msg.txt

          # Retry on transient network errors (4 attempts, 2/4/8s backoff)
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Mirror push OK"
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((2 ** i))
          done
          echo "::error::Failed to push after 4 attempts"
          exit 1
