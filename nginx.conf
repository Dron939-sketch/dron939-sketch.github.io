worker_processes auto;
error_log /var/log/nginx/error.log warn;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    client_max_body_size 50M;

    # DNS resolver для отложенного резолва upstream (через переменную в proxy_pass).
    # Без этого nginx пытается резолвить хост на старте, контейнер падает с
    # "host not found in upstream" если DNS ещё не готов или хост временно недоступен.
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=60s;
    resolver_timeout 5s;

    # Внешний backend (ffred Amvera сервис) — задаём через map чтобы переиспользовать.
    map $http_host $backend_host {
        default "ffred-ddd989.amvera.io";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /api/* → ffred backend (резолв at-request-time через переменную)
        location /api/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # WebSocket /ws/* → ffred
        location /ws/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # /health прямой роут (бэк)
        location = /health {
            proxy_pass https://$backend_host/health;
            proxy_set_header Host $backend_host;
            proxy_ssl_server_name on;
        }

        # Статика
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Custom 404 page (если есть в репо)
        error_page 404 /404.html;

        # cache headers для статики (картинки, шрифты, CSS, JS)
        location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|css|js|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
