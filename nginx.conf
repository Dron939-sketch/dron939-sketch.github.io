worker_processes auto;
error_log /var/log/nginx/error.log warn;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # UTF-8 charset для всех текстовых ответов — иначе кириллица показывается
    # как mojibake (РЎРѕРѕР±С‰Рё), а JS-файлы с кириллицей в комментариях
    # валятся SyntaxError при парсинге как cp1251.
    charset utf-8;
    # text/html не указываем: nginx всегда применяет charset к нему сам,
    # а явное перечисление даёт warning «duplicate MIME type "text/html"».
    charset_types text/css text/xml text/plain text/javascript
                  application/javascript application/json application/xml
                  application/rss+xml application/atom+xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    client_max_body_size 50M;

    # DNS resolver для отложенного резолва upstream (через переменную в proxy_pass).
    # Без этого nginx падает на старте если хост ещё не готов в DNS.
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=60s;
    resolver_timeout 5s;

    map $http_host $backend_host {
        default "ffred-ddd989.amvera.io";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # /api/* → ffred backend (резолв at-request-time через переменную)
        location /api/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # WebSocket /ws/* → ffred
        location /ws/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # /health прямой роут (бэк)
        location = /health {
            proxy_pass https://$backend_host/health;
            proxy_set_header Host $backend_host;
            proxy_ssl_server_name on;
        }

        # Боты-сканеры круглосуточно щупают секреты в скрытых файлах
        # (.env, .env.development, .git/config, .aws/credentials, .ssh, …).
        # Ничего этого на статике нет — коротко отвечаем 404, не трогаем
        # файловую систему и не засоряем access.log их перебором.
        # Исключение — .well-known (нужен для выпуска TLS-сертификатов).
        location ~ /\.(?!well-known) {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Статика
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;

        # Картинки и шрифты: содержимое под одним именем меняется редко —
        # агрессивный неизменяемый кэш на 30 дней.
        location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML/CSS/JS грузятся под ОДНИМ именем (app.js, styles.css, …) и
        # меняются часто. Если пометить их immutable — на мобиле застревает
        # старый код/текст из прошлого деплоя (классический баг «на десктопе
        # новое, на телефоне старое»). Поэтому заставляем браузер каждый раз
        # ревалидировать у сервера: ETag → 304, если не менялось; свежая
        # копия — если менялось.
        location ~* \.(html|css|js)$ {
            add_header Cache-Control "no-cache";
        }
    }
}
