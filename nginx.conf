worker_processes auto;
error_log /var/log/nginx/error.log warn;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # UTF-8 charset для всех текстовых ответов — иначе кириллица показывается
    # как mojibake (РЎРѕРѕР±С‰Рё), а JS-файлы с кириллицей в комментариях
    # валятся SyntaxError при парсинге как cp1251.
    charset utf-8;
    # text/html не указываем: nginx всегда применяет charset к нему сам,
    # а явное перечисление даёт warning «duplicate MIME type "text/html"».
    charset_types text/css text/xml text/plain text/javascript
                  application/javascript application/json application/xml
                  application/rss+xml application/atom+xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    client_max_body_size 50M;

    # DNS resolver для отложенного резолва upstream (через переменную в proxy_pass).
    # Без этого nginx падает на старте если хост ещё не готов в DNS.
    #
    # Строка ниже — ФОЛБЭК. На проде её при старте контейнера переписывает
    # tools/nginx-entrypoint/10-local-resolver.sh (лежит в /docker-entrypoint.d/):
    # он подставляет DNS платформы из /etc/resolv.conf. Внешние 8.8.8.8/1.1.1.1
    # из сети Amvera таймаутят — 2 сентября 2026 из-за этого прокси /api/
    # отвечал ошибкой «could not be resolved (110: Operation timed out)».
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=60s;
    resolver_timeout 5s;

    # Размер корзины хеша для map. По умолчанию 64 байта — под длину
    # строки кэша процессора, — и ключ длиннее в неё просто не влезает.
    # В карте старых адресов ниже самый длинный ключ 130 байт
    # (/kak-najti-novogo-sotrudnika-kotoryj-prevzojdyot-…/), и без этой
    # строки nginx не стартует вовсе:
    #
    #   [emerg] could not build map_hash, you should increase
    #           map_hash_bucket_size: 64
    #
    # Это не предупреждение и не деградация: сервер не поднимается, сайт
    # отдаёт 503 целиком. Проверено — именно так он и лёг 29 августа.
    map_hash_bucket_size 256;

    map $http_host $backend_host {
        default "ffred-ddd989.amvera.io";
    }

    # ── Адреса времён WordPress ────────────────────────────────────────────
    # Сайт переехал на статику, а адреса статей менять забыли. По выгрузке
    # «Страницы в поиске» Яндекса видно, чем это кончилось: страница стоит
    # в индексе как SEARCHABLE, потом отдаёт 404 и вылетает как HTTP_ERROR.
    # Так ушло около восьмидесяти адресов — вместе с возрастом, входящими
    # ссылками и позициями, которые они успели набрать.
    #
    # 404 не сообщает поиску, что материал никуда не делся и лежит рядом.
    # Это делает 301. Ниже — карта старого адреса на нынешний материал
    # по той же теме; где темы не осталось, адрес уходит на свой раздел.
    # Совсем служебные адреса (черновики, /author/, /category/) в карту не
    # входят: им отвечает 410 в самом server-блоке — материала нет и не
    # будет, и поиск выбрасывает такой адрес быстрее, чем при 404.
    map $uri $legacy_target {
        default "";

        # Посадочные разделов Фреди: канонический адрес — каталог со слэшем,
        # но руки набирают .html (владелец так и сделал 2 сентября — и попал
        # в 404). Каждому варианту с .html — 301 на канонический.
        /bolshoj-test-lichnosti.html   /bolshoj-test-lichnosti/;
        /skazkoterapiya.html           /skazkoterapiya/;
        /treker-privychek.html         /treker-privychek/;
        /navyk-za-21-den.html          /navyk-za-21-den/;
        /dnevnik-emocij.html           /dnevnik-emocij/;
        /superviziya.html              /superviziya/;
        /natalnaya-karta.html          /natalnaya-karta/;
        /dyhanie-4-7-8.html            /dyhanie-4-7-8/;
        /trenazher-skazat-net.html     /trenazher-skazat-net/;
        /express-test-lichnosti.html   /express-test-lichnosti/;
        /test-na-vygoranie.html        /test-na-vygoranie/;
        /kalkulyator-prokrastinacii.html /kalkulyator-prokrastinacii/;
        /koleso-balansa.html           /koleso-balansa/;
        /zazemlenie-5-4-3-2-1.html     /zazemlenie-5-4-3-2-1/;
        /test-na-samozvanca.html       /test-na-samozvanca/;
        /svoi-cennosti.html            /svoi-cennosti/;
        /stop-kran-myslej.html         /stop-kran-myslej/;
        /otvet-na-kritiku.html         /otvet-na-kritiku/;
        /test-na-odinochestvo.html     /test-na-odinochestvo/;
        /kontseptikon.html             /kontseptikon/;

        # Продукты: игры, книги, тренинги
        /didakticheskaya-igra-marketolog/            /igry/marketolog.html;
        /didakticheskaya-igra-variatika-basic/       /igry/variatika-basic.html;
        /didakticheskaya-igra-variatika-intensive/   /igry/variatika-intensive.html;
        /didakticheskaya-igra-variatika-prograssive/ /igry/variatika-progressive.html;
        /didakticheskie-igry/                        /igry/;
        /zachem-igrat-v-nastolnye-igry/              /igry/;
        /kniga-teoriya-manipulyaczii-razgovornyj-gipnoz/          /knigi/;
        /kniga-teoriya-manipulyaczii-tom-ii-proniczatelnost/      /knigi/;
        /kniga-teoriya-manipulyaczii-tom-iii-stimulnyj-kontrol/   /knigi/;

        # Продающие страницы курса по профессиям — все вели на один продукт
        /kurs-razgovornyj-gipnoz/                    /treningi/razgovornyy-gipnoz-standart.html;
        /kurs-razgovornyj-gipnoz-teper-imeet-formu/  /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-paket-standartnyj/       /treningi/razgovornyy-gipnoz-standart.html;
        /onlajn-praktikum/                           /treningi/;
        /kupit-kurs/                                 /treningi/;
        /razgovornyj-gipnoz-dlya-fotografov/                     /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-roditelej/                      /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-sportivnyh-trenerov/            /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-marketologov/                   /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-pedagogov-i-uchitelej/          /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-psihoterapevtov-i-konsultantov/ /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-torgovyh-predstavitelej/        /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-rukovoditelej-i-menedzherov/    /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-yuristov-i-advokatov/           /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-mediczinskih-rabotnikov/        /treningi/razgovornyy-gipnoz-standart.html;
        /razgovornyj-gipnoz-dlya-devushki/                       /treningi/razgovornyy-gipnoz-standart.html;

        # Внушение и влияние
        /samogipnoz-chto-eto-takoe-i-kak-eto-sdelat/ /blog/samogipnoz-dlya-nachinayushih.html;
        /kosvennye-vnusheniya/                       /blog/skrytoe-vnushenie-7-primerov.html;
        /primer-kosvennogo-vnusheniya/               /blog/skrytoe-vnushenie-7-primerov.html;
        /pryamoe-vnushenie/                          /blog/skrytoe-vnushenie-7-primerov.html;
        /vnushenie-ubezhdenij/                       /blog/skrytoe-vnushenie-7-primerov.html;
        /suggestiya/                                 /blog/razgovornyy-gipnoz-tekhniki.html;
        /chto-takoe-temnaya-psihologiya/             /blog/chto-takoe-manipulyaciya.html;
        /kak-protivostoyat-manipulyacziyam/          /blog/zashchita-ot-davleniya-10-tekhnik.html;
        /kak-verbuet-fsb/                            /blog/lekciya-vliyanie-9-kulty-i-verbovka.html;
        /ponimanie-psihologii-reklamy/               /blog/refleks-uznavaniya-formula-uvidel-uznal.html;
        /priemy-rechevogo-vozdejstviya-v-reklame/    /blog/refleks-uznavaniya-formula-uvidel-uznal.html;
        /iskusstvo-dominirovat/                      /blog/lektorij/status-i-dominirovanie/;

        # Уверенность, самооценка, чувства
        /uverennost-v-sebe/                          /blog/uverennost-7-urovney.html;
        /kak-obresti-uverennost-v-sebe/              /blog/uverennost-7-urovney.html;
        /kak-povysit-samooczenku-i-obresti-uverennost/ /blog/nizkaya-samoocenka-priznaki-i-protokol.html;
        /kak-perestat-chuvstvovat-vinu/              /blog/styd-vs-vina-raznica-kotoraya-kalechit.html;
        /kak-reagirovat-na-kritiku-v-svoj-adres/     /blog/chto-delat-esli-vas-obescenivayut.html;
        /kak-stat-optimistom/                        /blog/ustanovka-na-rost-poka.html;
        /konflikt-chto-delat-esli-strashno/          /blog/lektorij/konflikty/;

        # Деньги и работа
        /kak-poluchat-bolshe-deneg/                  /blog/psihologiya-deneg-6-arhetipov-test.html;
        /kak-sekonomit-dengi/                        /blog/psihologiya-deneg-6-arhetipov-test.html;
        /glavnyj-priznak-nishhebroda/                /blog/psihologiya-deneg-6-arhetipov-test.html;
        /podumaj-o-svoem-otnoshenii-k-veshham/       /blog/shopogolizm-kompulsivnye-pokupki.html;
        /predvidite-budushhee-razlichie-mezhdu-aktivami-i-passivami/ /blog/lekciya-dist-13-aktiv.html;
        /kak-podnyatsya-v-pishhevoj-czepochke/       /blog/lekciya-dist-4-klass.html;
        /kak-najti-novogo-sotrudnika-kotoryj-prevzojdyot-predydushhego-ekspertnye-sovety-i-luchshie-praktiki-po-poisku-i-otboru-personala/ /blog/skrytyj-povedencheskij-test-podbora-personala.html;
        /6-klyuchevyh-soczialnyh-navykov-dlya-dostizheniya-uspeha/   /blog/soft-skills-2026-8-klyuchevyh-navykov.html;

        # Мышление и обучение
        /chto-takoe-strategicheskoe-myshlenie/       /blog/sistemnoe-myshlenie-v-biznese.html;
        /chto-takoe-analiticheskoe-myshlenie/        /blog/sistemnoe-myshlenie-7-uprazhneniy.html;
        /luchshij-sposob-osvoit-novyj-navyk/         /blog/trenirovka-navykov-za-21-den.html;
        /samoe-glavnoe-znanie-psihologii/            /blog/;
        /klyuchevye-psihologicheskie-eksperimenty-raskryvayushhie-zagadki-chelovecheskogo-povedeniya/ /blog/lektorij/socialnaya-psihologiya/;
        /psihologiya-i-filosofiya-dialog-o-raspredmechivanii-soznaniya-i-transformaczii-vospriyatiya/ /blog/lektorij/filosofiya/;
        /kopirovanie-eto-velikolepnyj-sposob-poteryat-sebya-i-svoyu-individualnost/ /blog/lekciya-perepr-1-ty-ne-s-nulya.html;

        # Призвание и путь
        /glavnoe-prepyatstvie-na-puti-k-lyubimomu-delu/ /blog/ne-znayu-chego-ya-hochu.html;
        /pochemu-mnogim-trudno-najti-lyubimoe-delo/     /blog/ne-znayu-chego-ya-hochu.html;

        # Типажи и образ
        /kakoj-ya/                                   /blog/psihologicheskij-portret-zachem-znat-psihotip.html;
        /druzhelyubnyj-motivator-razbor/             /blog/psihologicheskij-portret-zachem-znat-psihotip.html;
        /ekspertnyj-analitik-razbor/                 /blog/psihologicheskij-portret-zachem-znat-psihotip.html;
        /emoczionalnyj-empat-razbor/                 /blog/psihologicheskij-portret-zachem-znat-psihotip.html;
        /tonkij-strateg-razbor/                      /blog/psihologicheskij-portret-zachem-znat-psihotip.html;
        /arhetip-protiv-stereotipa/                  /blog/arhetipy-proshivki-lichnosti.html;
        /lichnyj-mif/                                /blog/arhetipy-proshivki-lichnosti.html;
        /imidzh/                                     /blog/psihologiya-lichnogo-brenda-7-principov.html;

        # Общество, сеть, репутация
        /informacziya-zarazna-kak-nashi-kontakty-formiruyut-budushhee/ /blog/kak-rabotaet-infopole-vk.html;
        /kak-my-vybiraem-komu-doveryat-v-internete-socziologiya-czifrovoj-reputaczii/ /blog/cifrovoj-sled-chto-google-rasskazhet-cherez-20-let.html;

        # Отношения и эзотерика
        /kak-najti-sebe-bogatogo-muzha/              /blog/rubrika/otnosheniya/;
        /zakrytie-karmicheskogo-hvosta-cherez-syuzhet-skazki-2/ /blog/rabotayut-li-ritualy-taro-astrologiya.html;

        # Служебное
        /informacziya-ob-usloviyah-provedeniya-konsultaczii/ /kontakty/;
    }

    # www → без www. Записи www в DNS пока нет, и этот блок ничего не делает;
    # он стоит здесь заранее, чтобы в день, когда запись появится, у сайта не
    # оказалось двух копий каждой из 1752 страниц по двум разным адресам.
    # Поиск такое считает дублем, а canonical по всему сайту указывает на
    # адрес без www — значит и сервер должен отвечать так же.
    server {
        listen 80;
        server_name www.meysternlp.ru;

        # Выпуск сертификата проверяет владение доменом файлом по адресу
        # /.well-known/acme-challenge/… именно на том имени, для которого
        # выдаётся сертификат. Если увести www целиком, проверка поедет на
        # адрес без www и не найдёт там своего файла — сертификат для www не
        # выдастся, а посетитель увидит предупреждение браузера. Поэтому
        # .well-known отдаём как обычно, и уводим всё остальное.
        location /.well-known/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        location / {
            return 301 https://meysternlp.ru$request_uri;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # TLS снимает Амвера, до nginx запрос доходит по http — и в свои
        # собственные 301 (каталог без слэша, правила ниже) nginx подставлял
        # http://meysternlp.ru/…, отправляя браузер на лишний круг и роняя
        # переход на незащищённую схему. С относительным Location браузер
        # сохраняет ту схему и хост, по которым пришёл. Явные редиректы
        # вида «return 301 https://…» это не трогает.
        absolute_redirect off;

        # Старый адрес WordPress → нынешний материал по той же теме.
        # Стоит первым в блоке: до try_files, чтобы 301 отдавался раньше,
        # чем nginx пойдёт искать несуществующий файл и вернёт 404.
        if ($legacy_target) {
            return 301 https://meysternlp.ru$legacy_target;
        }

        # /api/* → ffred backend (резолв at-request-time через переменную)
        location /api/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            # Чат и голос отвечают потоками (NDJSON): с буферизацией nginx
            # копил бы дельты в буфере, и «первое предложение через
            # секунду» превращалось бы в «весь ответ в конце генерации».
            # Стриминг — весь смысл /api/chat/stream, поэтому буферизация
            # ответа выключена; тела запросов (голосовые куски) — тоже.
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket /ws/* → ffred
        location /ws/ {
            proxy_pass https://$backend_host$request_uri;
            proxy_set_header Host $backend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # /health прямой роут (бэк)
        location = /health {
            proxy_pass https://$backend_host/health;
            proxy_set_header Host $backend_host;
            proxy_ssl_server_name on;
        }

        # Боты-сканеры круглосуточно щупают секреты в скрытых файлах
        # (.env, .env.development, .git/config, .aws/credentials, .ssh, …).
        # Ничего этого на статике нет — коротко отвечаем 404, не трогаем
        # файловую систему и не засоряем access.log их перебором.
        # Исключение — .well-known (нужен для выпуска TLS-сертификатов).
        location ~ /\.(?!well-known) {
            access_log off;
            log_not_found off;
            return 404;
        }

        # Наследие WordPress. Сайт давно статический, но старые адреса
        # картинок (/wp-content/uploads/...) живут в поисковых индексах и
        # чужих ссылках, а /wp-admin, wp-login.php и xmlrpc.php перебирают
        # боты. Файлов нет и не будет — отвечаем 410 Gone: поисковик
        # выбрасывает адрес из индекса быстрее, чем при 404, а error.log
        # перестаёт заполняться «open() failed» на каждый заход.
        location ~ ^/(wp-content|wp-includes|wp-admin|wp-json)(/|$)|^/(wp-login|xmlrpc)\.php$ {
            access_log off;
            log_not_found off;
            return 410;
        }

        # Служебные адреса WordPress, за которыми не стоит материала:
        # листалки рубрик, страница автора, черновики, техническая проверка
        # редиректа. Редирект им некуда, а 410 говорит поиску «этого нет
        # насовсем» — адрес выбрасывается из индекса, не дожидаясь, пока
        # робот перепроверит 404 несколько раз.
        location ~ ^/(category|author)(/|$)|^/(chernovik|stati|test-perenapravleniya|dopolnitelnye-materialy-2|dopolnitelnye-materialy-3)/$ {
            access_log off;
            return 410;
        }

        # Статика
        location / {
            try_files $uri $uri/ $uri.html @slash_html;
        }

        # Адрес со слэшем на конце, за которым лежит не каталог, а файл:
        # /treningi/razgovornyy-gipnoz-standart/ при живом …-standart.html.
        # try_files умеет $uri, $uri/ и $uri.html, но снять конечный слэш
        # не умеет, поэтому такие адреса отдавали 404 — и оба тренинга
        # успели вылететь из индекса Яндекса с HTTP_ERROR.
        #
        # Отдаём 301, а не показываем файл на месте: иначе одна и та же
        # страница осталась бы доступна по двум адресам, со слэшем и без,
        # и поиску пришлось бы решать, какой из них главный. Сюда доходят
        # только адреса, для которых не нашлось ни файла, ни каталога,
        # так что /blog/ и прочие настоящие каталоги этой ветки не видят.
        location @slash_html {
            # Первым — адрес, у которого расширение уже есть:
            # /blog/statya.html/ → /blog/statya.html. Без этой строки
            # общее правило ниже приклеивало второе расширение и слало
            # робота на /blog/statya.html.html, то есть в 404. В логах
            # это выглядело как обращения к /blog/statya.html/blog/progress.js.
            rewrite ^(/.+\.html)/$ $1 permanent;
            rewrite ^(/.+)/$ $1.html permanent;
            return 404;
        }

        error_page 404 /404.html;

        # Картинки и шрифты: содержимое под одним именем меняется редко —
        # агрессивный неизменяемый кэш на 30 дней.
        location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # HTML/CSS/JS грузятся под ОДНИМ именем (app.js, styles.css, …) и
        # меняются часто. Если пометить их immutable — на мобиле застревает
        # старый код/текст из прошлого деплоя (классический баг «на десктопе
        # новое, на телефоне старое»). Поэтому заставляем браузер каждый раз
        # ревалидировать у сервера: ETag → 304, если не менялось; свежая
        # копия — если менялось.
        location ~* \.(html|css|js)$ {
            add_header Cache-Control "no-cache";
        }
    }
}
