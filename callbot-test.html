<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поговорить с роботом — Перекличка</title>
<meta name="robots" content="noindex, follow">
<style>
  :root{--ink:#12171d;--ink2:#3d4753;--grey:#6c7783;--line:#d7dce2;--bg:#eceef1;
        --accent:#1f4e79;--ok:#1a6b3c;--bad:#94301a;--soft:#f4f6f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14.5px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;
       padding:26px 18px 40px}
  .wrap{width:100%;max-width:760px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .mark{width:28px;height:28px;border-radius:6px;background:#2f6fa8;display:grid;
        place-items:center;color:#fff;font-weight:800;font-size:14px}
  .brand b{font-size:17px}
  .brand span{color:var(--grey);font-size:13px}
  .lead{color:var(--grey);font-size:13px;margin:0 0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
  .row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;margin-bottom:12px}
  .row label{font-size:12.5px;color:var(--ink2);font-weight:600}
  select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  .go{width:100%;border:0;border-radius:6px;padding:14px;font:inherit;font-size:15px;font-weight:700;
      background:var(--accent);color:#fff;cursor:pointer}
  .go:disabled{background:#c9d2db}
  .stop{width:100%;border:1px solid var(--line);border-radius:6px;padding:11px;font:inherit;
        font-weight:600;background:#fff;color:var(--bad);cursor:pointer;margin-top:8px;display:none}
  .status{margin-top:10px;font-size:13px;color:var(--grey)}
  .status.live{color:var(--ok);font-weight:600}
  .status.err{color:var(--bad)}
  .log{margin-top:14px;display:grid;gap:8px;max-height:360px;overflow:auto}
  .msg{padding:8px 11px;border-radius:8px;font-size:13.5px;max-width:88%}
  .msg.agent{background:var(--soft)}
  .msg.user{background:#eef3f8;margin-left:auto}
  .msg small{display:block;color:var(--grey);font-size:11px;margin-bottom:2px}
  .hint{color:var(--grey);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">П</div><b>Перекличка</b><span>проба голоса</span></div>
  <p class="lead">Поговорите с роботом в браузере — как он будет говорить по телефону.
     Нужен микрофон; никуда не звоним, деньги не тратятся.</p>

  <div class="card">
    <div class="row">
      <label>Кто звонит</label>
      <select id="whoSel">
        <option value="info_products">Фреди, ИИ-психолог</option>
        <option value="auto_services">Агент авто-услуг</option>
      </select>
    </div>
    <button class="go" id="startBtn">Начать разговор</button>
    <button class="stop" id="stopBtn">Завершить</button>
    <div class="status" id="status">Готово к разговору</div>
    <div class="hint">Разговор записывается для проверки качества — как и настоящий звонок.</div>
  </div>

  <div class="card">
    <div class="row" style="margin:0"><label>Расшифровка</label><span></span></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script type="module">
const API = 'https://pereklichka-ddd989.mia0.amvera.tech';
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let session = null;

function say(kind, text) {
  const box = document.createElement('div');
  box.className = 'msg ' + kind;
  box.innerHTML = '<small>' + (kind === 'agent' ? 'Робот' : 'Вы') + '</small>';
  box.appendChild(document.createTextNode(text));
  log.appendChild(box);
  log.scrollTop = log.scrollHeight;
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  setStatus('Создаю сессию…');
  try {
    const res = await fetch(API + '/api/callbot/web-session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ direction_id: document.getElementById('whoSel').value })
    });
    if (!res.ok) throw new Error('сессия: ' + res.status);
    const sessionToken = await res.json();

    const { AgentSession } = await import('https://cdn.jsdelivr.net/npm/@fishaudio/agent-client/+esm');
    session = await AgentSession.start({ sessionToken });

    setStatus('Идёт разговор', 'live');
    stopBtn.style.display = 'block';

    session.on('message', ({ role, text }) => say(role === 'agent' ? 'agent' : 'user', text));
    session.on('disconnect', ({ reason }) => {
      setStatus('Разговор закончен: ' + reason);
      startBtn.disabled = false;
      stopBtn.style.display = 'none';
      session = null;
    });
    session.on('error', err => setStatus('Ошибка: ' + (err.code || 'unknown'), 'err'));
  } catch (e) {
    setStatus('Не получилось: ' + e.message, 'err');
    startBtn.disabled = false;
  }
});

stopBtn.addEventListener('click', async () => {
  if (session) { await session.end(); }
});
</script>
</body>
</html>
